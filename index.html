<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Content Unlocker</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #111827;
      border-radius: 20px;
      padding: 28px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .progress-bar-container {
      width: 100%;
      height: 24px;
      background-color: #1f2937;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: #0284c7;
      transition: width 0.3s ease;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 20px;
      padding: 0 2px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background-color 0.2s, opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      opacity: 0.85;
      transform: scale(0.98);
    }

    /* Top Button: Share */
    .btn-share {
      background-color: #0ea5e9;
      color: #ffffff;
    }

    /* Bottom Button: Unlock (Disabled/Active states) */
    .btn-unlock {
      background-color: #1f2937;
      color: #6b7280;
      cursor: not-allowed;
      margin-top: 4px;
    }

    .btn-unlock.active {
      background-color: #eab308;
      color: #000000;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Mom Son ?? IS LOCKED</h2>

    <div class="progress-bar-container">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>

    <div class="progress-info">
      <span id="progress-percent">0% Completed</span>
      <span id="task-count">0 / 5 Tasks</span>
    </div>

    <!-- Top Action: Share Link -->
    <button id="share-btn" class="btn btn-share" onclick="handleShareTask()">SHARE TO UNLOCK (0/5)</button>

    <!-- Bottom Action: Final Unlock -->
    <button id="unlock-btn" class="btn btn-unlock" disabled onclick="unlockContent()">UNLOCK VIDEOS (0/5)</button>
  </div>

  <script>
    // Initialize Telegram WebApp SDK
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Configuration
    let completedTasks = 0;
    const totalTasks = 5;

    // Direct Telegram Share Link
    const DIRECT_SHARE_URL = "https://t.me/share/url?url=%20JOIN%20THIS%20AMAZING%20GROUP%20%F0%9F%A5%B5%20-%20https%3A%2F%2Ft.me%2F%2BIReYrDe7TbowZGNl";

    // Top Button Action: Share
    function handleShareTask() {
      if (completedTasks >= totalTasks) return;

      if (tg) {
        tg.openTelegramLink(DIRECT_SHARE_URL);
      } else {
        window.open(DIRECT_SHARE_URL, '_blank');
      }

      completedTasks++;
      updateUI();
    }

    // Bottom Button Action: Unlock
    function unlockContent() {
      if (completedTasks >= totalTasks) {
        alert("🎉 All tasks completed! Unlocking videos now...");
      }
    }

    // Update UI Progress
    function updateUI() {
      if (completedTasks > totalTasks) completedTasks = totalTasks;

      const percent = Math.round((completedTasks / totalTasks) * 100);
      document.getElementById('progress-percent').innerText = `${percent}% Completed`;
      document.getElementById('task-count').innerText = `${completedTasks} / ${totalTasks} Tasks`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      const shareBtn = document.getElementById('share-btn');
      const unlockBtn = document.getElementById('unlock-btn');

      if (completedTasks >= totalTasks) {
        shareBtn.innerText = `COMPLETED (5/5)`;
        shareBtn.disabled = true;
        shareBtn.style.opacity = "0.6";

        unlockBtn.classList.add('active');
        unlockBtn.disabled = false;
        unlockBtn.innerText = `🎉 UNLOCK VIDEOS NOW`;
      } else {
        shareBtn.innerText = `SHARE TO UNLOCK (${completedTasks}/${totalTasks})`;
        unlockBtn.innerText = `UNLOCK VIDEOS (${completedTasks}/${totalTasks})`;
      }
    }
  </script>

</body>
</html>

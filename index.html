<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Unlocker</title>
  
  <!-- 1. Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- 2. Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .progress-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-share {
      background-color: #0284c7;
      color: white;
    }

    .btn-ad {
      background-color: #22c55e;
      color: white;
    }

    .btn-unlock {
      background-color: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    .btn-unlock.active {
      background-color: #eab308;
      color: #000;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>CONTENT IS LOCKED</h2>

    <div class="progress-bar">
      <span id="progress-percent">0% Completed</span>
      <span id="task-count">0 / 5 Tasks</span>
    </div>

    <button class="btn btn-share" onclick="shareApp()">STEP 1: SHARE TO UNLOCK</button>
    <button class="btn btn-ad" onclick="watchAd()">STEP 2: WATCH AD (+1 TASK)</button>
    <button id="unlock-btn" class="btn btn-unlock" disabled onclick="unlockContent()">UNLOCK CONTENT (0/5)</button>
  </div>

  <script>
    // Initialize Telegram SDK
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // App State
    let completedTasks = 0;
    const totalTasks = 5;
    const ADSGRAM_BLOCK_ID = "40172";

    // Watch Ad Function
    function watchAd() {
      // 1. Check if inside Telegram
      if (!tg || !tg.initData) {
        alert("Please open this Mini App directly inside Telegram to watch ads!");
        return;
      }

      // 2. Check if Adsgram SDK was blocked or failed to load
      if (typeof window.Adsgram === "undefined") {
        alert("Adsgram SDK is still loading or blocked by Private DNS/AdBlock. Disable AdBlock and try again.");
        return;
      }

      // 3. Initialize and trigger ad on demand
      try {
        const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });

        AdController.show()
          .then((result) => {
            completedTasks++;
            updateUI();
            alert("Task completed! (+1)");
          })
          .catch((error) => {
            console.error("Adsgram Error:", error);
            alert("Ad couldn't load: " + (error.description || error.error || JSON.stringify(error)));
          });
      } catch (err) {
        console.error(err);
        alert("Error initializing ad: " + err.message);
      }
    }

    // Share logic
    function shareApp() {
      if (tg) {
        const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent('Check out this Mini App!')}`;
        tg.openTelegramLink(shareUrl);
      } else {
        alert("Open inside Telegram to share.");
      }
    }

    // Update progress bar & button state
    function updateUI() {
      if (completedTasks > totalTasks) completedTasks = totalTasks;

      const percent = Math.round((completedTasks / totalTasks) * 100);
      document.getElementById('progress-percent').innerText = `${percent}% Completed`;
      document.getElementById('task-count').innerText = `${completedTasks} / ${totalTasks} Tasks`;

      const unlockBtn = document.getElementById('unlock-btn');
      unlockBtn.innerText = `UNLOCK CONTENT (${completedTasks}/${totalTasks})`;

      if (completedTasks >= totalTasks) {
        unlockBtn.classList.add('active');
        unlockBtn.disabled = false;
      }
    }

    // Final Unlock action
    function unlockContent() {
      if (completedTasks >= totalTasks) {
        alert("Congratulations! Content Unlocked 🎉");
      }
    }
  </script>
</body>
</html>

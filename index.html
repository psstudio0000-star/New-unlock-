<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HD Premium Video Player</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script id="adsgram-script" src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #090d16 60%, #030712 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    .background-glow {
      position: absolute;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0,0,0,0) 70%);
      top: 10%;
      z-index: 0;
      animation: float 6s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-30px); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 22px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(99, 102, 241, 0.15);
    }

    .player-preview {
      width: 100%;
      height: 190px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.2) 0%, rgba(15, 23, 42, 0.95) 100%), 
                  url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=600&auto=format&fit=crop') center/cover;
      border-radius: 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
    }

    .play-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .play-pulse-ring {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.4);
      animation: ringPulse 2s infinite;
    }

    @keyframes ringPulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .play-icon {
      position: relative;
      z-index: 2;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
      cursor: pointer;
    }

    .play-icon::after {
      content: '';
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 11px 0 11px 19px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 5px;
    }

    .video-status-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }

    .quality-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(99, 102, 241, 0.8);
      backdrop-filter: blur(8px);
      font-size: 10px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      color: #ffffff;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: blink 1.2s infinite;
    }

    @keyframes blink { 50% { opacity: 0.3; } }

    .video-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: #f8fafc;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .video-subtext {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .steps-grid {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 16px;
    }

    .step-box {
      flex: 1;
      height: 34px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      transition: all 0.4s ease;
    }

    .step-box.completed {
      background: rgba(34, 197, 94, 0.2);
      border-color: #22c55e;
      color: #4ade80;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
    }

    .progress-bar-container {
      width: 100%;
      height: 14px;
      background-color: rgba(15, 23, 42, 0.9);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #06b6d4, #10b981);
      border-radius: 20px;
      transition: width 0.4s ease;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.7);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    .btn {
      position: relative;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .btn-unlock {
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      color: #ffffff;
      box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-unlock::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, transparent, rgba(255,255,255,0.25), transparent);
      transform: rotate(30deg);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) rotate(30deg); }
      20% { transform: translateX(100%) rotate(30deg); }
      100% { transform: translateX(100%) rotate(30deg); }
    }

    .btn-unlock.active {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
    }

    .btn-unlock:disabled {
      opacity: 0.85;
      cursor: not-allowed;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(3, 7, 18, 0.92);
      justify-content: center;
      align-items: center;
      z-index: 9999;
      backdrop-filter: blur(10px);
    }

    .modal-box {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #ef4444;
      border-radius: 24px;
      padding: 26px 20px;
      width: 88%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.35);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .share-icon-wrapper {
      width: 60px;
      height: 60px;
      background: rgba(239, 68, 68, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px auto;
      font-size: 28px;
      border: 1px solid #ef4444;
    }

    .share-count-text {
      color: #ef4444;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .share-instruction {
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .share-link-btn {
      display: block;
      width: 100%;
      text-decoration: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      padding: 14px 0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 10px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }

    .ok-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      border: none;
      padding: 14px 0;
      width: 100%;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
    }
  </style>
</head>
<body>

  <div class="background-glow"></div>

  <div class="card">
    <div class="player-preview">
      <div class="video-status-tag"><span class="live-dot"></span> LOCKED • ULTRA HD</div>
      <div class="quality-badge">4K 60FPS</div>
      <div class="play-wrapper" onclick="handleUnlockClick()">
        <div class="play-pulse-ring"></div>
        <div class="play-icon"></div>
      </div>
    </div>

    <div class="video-title">STEP MOM (FULL MOVIE)</div>
    <div class="video-subtext">Duration: 1h 48m • Server #1 Fast Stream</div>

    <!-- 5 Visual Step Boxes -->
    <div class="steps-grid">
      <div class="step-box" id="step-1">KEY 1</div>
      <div class="step-box" id="step-2">KEY 2</div>
      <div class="step-box" id="step-3">KEY 3</div>
      <div class="step-box" id="step-4">KEY 4</div>
      <div class="step-box" id="step-5">KEY 5</div>
    </div>

    <div class="progress-bar-container">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>

    <div class="progress-info">
      <span id="progress-percent">0% Decrypted</span>
      <span id="task-count">0 / 5 Keys</span>
    </div>

    <button id="unlock-btn" class="btn btn-unlock" onclick="handleUnlockClick()">🔓 UNLOCK KEY 1 (0/5)</button>
  </div>

  <!-- Modal Pop-Up after 5 ads -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal-box">
      <div class="share-icon-wrapper">⚠️</div>
      <div class="share-count-text">Opps! You haven't shared 3 links 🔗</div>
      <div class="share-instruction">
        Please share this link to <b>3 Telegram groups/friends</b> to get instant access!
      </div>
      
      <!-- Share Link Button -->
      <a class="share-link-btn" href="https://t.me/share/url?url=https%3A%2F%2Ft.me%2F%2Bcs76HfenGYI4MWQ1&text=JOIN%20THIS%20AMAZING%20GROUP%20%F0%9F%A5%B5" target="_blank" onclick="registerShareClick()">
        📲 SHARE TO 3 GROUPS
      </a>

      <button class="ok-btn" onclick="handleModalOkClick()">▶ WATCH NOW FULL HD</button>
    </div>
  </div>

  <script>
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let completedTasks = 0;
    const totalTasks = 5;
    const ADSGRAM_BLOCK_ID = "42947";
    let isWaiting = false;
    let hasShared = false;

    const FINAL_DESTINATION_URL = "https://t.me/+cs76HfenGYI4MWQ1";

    const stepMessages = [
      "🔓 UNLOCK KEY 1 (0/5)",
      "⚡ UNLOCK KEY 2 (1/5)",
      "🎥 UNLOCK KEY 3 (2/5)",
      "🔑 UNLOCK KEY 4 (3/5)",
      "🚀 FINAL UNLOCK KEY (4/5)"
    ];

    function handleUnlockClick() {
      if (completedTasks >= totalTasks) {
        showShareModal();
        return;
      }

      if (isWaiting) return;
      isWaiting = true;

      const unlockBtn = document.getElementById('unlock-btn');
      unlockBtn.disabled = true;
      unlockBtn.innerText = "⚡ VERIFYING DECRYPTION...";

      executeAdCall();
    }

    function executeAdCall() {
      if (typeof window.Adsgram !== "undefined") {
        try {
          const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });

          AdController.show()
            .then((result) => {
              if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
              }
              completedTasks++;
              updateUI();

              if (completedTasks >= totalTasks) {
                isWaiting = false;
                showShareModal();
              } else {
                startCoolDownBuffer("⚡ Next key loading in");
              }
            })
            .catch((error) => {
              startCoolDownBuffer("⚠️ Ad missed, retrying in");
            });
        } catch (err) {
          startCoolDownBuffer("⏳ Retrying connection in");
        }
      } else {
        startCoolDownBuffer("⏳ Loading ad server in");
      }
    }

    function startCoolDownBuffer(msgPrefix) {
      const unlockBtn = document.getElementById('unlock-btn');
      let timeLeft = 2;

      const cooldown = setInterval(() => {
        unlockBtn.innerText = `${msgPrefix} ${timeLeft}s...`;
        timeLeft--;

        if (timeLeft < 0) {
          clearInterval(cooldown);
          isWaiting = false;
          updateUI();
        }
      }, 1000);
    }

    function updateUI() {
      if (completedTasks > totalTasks) completedTasks = totalTasks;

      for (let i = 1; i <= totalTasks; i++) {
        const box = document.getElementById(`step-${i}`);
        if (i <= completedTasks) {
          box.classList.add('completed');
          box.innerText = "✓ OK";
        }
      }

      const percent = Math.round((completedTasks / totalTasks) * 100);
      document.getElementById('progress-percent')

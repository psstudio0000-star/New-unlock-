<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>grpbot</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script id="adsgram-script" src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #03060d;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* Card exactly as shown in video recording */
    .card {
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 28px;
      padding: 32px 22px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      text-align: center;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.6px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* Progress bar matching video */
    .progress-bar-bg {
      width: 100%;
      height: 14px;
      background: #151c2c;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #2563eb;
      border-radius: 20px;
      transition: width 0.3s ease-in-out;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-share {
      background: #1d75f2;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(29, 117, 242, 0.3);
    }

    .btn-unlock {
      background: #162032;
      color: #ffffff;
    }

    .btn-unlock.completed {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-title">SLEEPY SISTER IS LOCKED</div>

    <div class="progress-bar-bg">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>

    <div class="progress-meta">
      <span id="percent-text">0% Completed</span>
      <span id="tasks-text">0 / 6 Tasks</span>
    </div>

    <div class="btn-group">
      <button class="btn btn-share" onclick="handleShare()">SHARE</button>
      <button id="unlock-btn" class="btn btn-unlock" onclick="handleTaskClick()">UNLOCK VIDEOS (0/6)</button>
    </div>
  </div>

  <script>
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let completedTasks = 0;
    const totalTasks = 6;
    const ADSGRAM_BLOCK_ID = "43327";

    const SHARE_LINK = "https://t.me/share/url?url=https%3A%2F%2Ft.me%2F%2Bcs76HfenGYI4MWQ1&text=Watch%20HD%20Videos";
    const FINAL_DESTINATION_URL = "https://t.me/+cs76HfenGYI4MWQ1";

    function handleTaskClick() {
      if (completedTasks >= totalTasks) {
        openFinalLink();
        return;
      }

      const unlockBtn = document.getElementById('unlock-btn');
      unlockBtn.disabled = true;

      executeAdCall();
    }

    function executeAdCall() {
      const unlockBtn = document.getElementById('unlock-btn');

      if (typeof window.Adsgram !== "undefined") {
        try {
          const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });

          AdController.show()
            .then((result) => {
              if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
              }
              completedTasks++;
              updateUI();
            })
            .catch((error) => {
              unlockBtn.disabled = false;
              updateUI();
            });
        } catch (err) {
          unlockBtn.disabled = false;
          updateUI();
        }
      } else {
        unlockBtn.disabled = false;
        updateUI();
      }
    }

    function updateUI() {
      if (completedTasks > totalTasks) completedTasks = totalTasks;

      const percent = Math.round((completedTasks / totalTasks) * 100);
      
      document.getElementById('percent-text').innerText = `${percent}% Completed`;
      document.getElementById('tasks-text').innerText = `${completedTasks} / ${totalTasks} Tasks`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      const unlockBtn = document.getElementById('unlock-btn');
      unlockBtn.disabled = false;

      if (completedTasks >= totalTasks) {
        unlockBtn.classList.add('completed');
        unlockBtn.innerText = "▶ WATCH FULL VIDEO NOW";
      } else {
        unlockBtn.innerText = `UNLOCK VIDEOS (${completedTasks}/${totalTasks})`;
      }
    }

    function handleShare() {
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(SHARE_LINK);
      } else {
        window.open(SHARE_LINK, '_blank');
      }
    }

    function openFinalLink() {
      if (tg && tg.openTelegramLink && FINAL_DESTINATION_URL.includes("t.me")) {
        tg.openTelegramLink(FINAL_DESTINATION_URL);
      } else {
        window.location.href = FINAL_DESTINATION_URL;
      }
    }
  </script>

</body>
</html>

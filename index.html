<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Content Unlocker</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #161b26;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      border: 1px solid #232a3b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .progress-bar-container {
      width: 100%;
      height: 24px;
      background-color: #212938;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: #007aff;
      border-radius: 12px;
      transition: width 0.3s ease;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      font-weight: 500;
      color: #8e9bae;
      margin-bottom: 28px;
      padding: 0 4px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s ease, background-color 0.2s ease;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Primary Action: Share Button */
    .btn-share {
      background-color: #007aff;
      color: #ffffff;
    }

    /* Target Action: Unlock Button */
    .btn-unlock {
      background-color: #212938;
      color: #ffffff;
      margin-bottom: 0;
    }

    .btn-unlock.active {
      background-color: #eab308;
      color: #000000;
    }

    /* Screenshot Matching Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-box {
      background-color: #080808;
      border: 1.5px solid #ff3b30;
      border-radius: 18px;
      padding: 28px 20px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 59, 48, 0.25);
    }

    .share-count-text {
      color: #ff3b30;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .share-instruction {
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .ok-btn {
      background-color: #ff3b30;
      color: #ffffff;
      border: none;
      padding: 12px 0;
      width: 100%;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .ok-btn:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>STEP MOM IS LOCKED</h2>

    <div class="progress-bar-container">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>

    <div class="progress-info">
      <span id="progress-percent">0% Completed</span>
      <span id="task-count">0 / 5 Tasks</span>
    </div>

    <!-- Option 1: Share Link -->
    <button class="btn btn-share" onclick="handleShareTask()">SHARE</button>

    <!-- Option 2: Unlock / Watch Ad Button -->
    <button id="unlock-btn" class="btn btn-unlock" onclick="handleUnlockClick()">UNLOCK VIDEOS (0/5)</button>
  </div>

  <!-- Screenshot Popup Structure -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal-box">
      <div class="share-count-text">YOUR SHARE = <span id="modal-share-count">0</span></div>
      <div class="share-instruction">SHARE TO 3 USERS TO UNLOCK</div>
      <button class="ok-btn" onclick="handleModalOkClick()">OK</button>
    </div>
  </div>

  <script>
    // Initialize Telegram WebApp SDK
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Configuration
    let completedTasks = 0;
    const totalTasks = 5;
    const ADSGRAM_BLOCK_ID = "40172";
    let isAdLoading = false;
    
    // Telegram Share URL for task completion
    const DIRECT_SHARE_URL = "https://t.me/share/url?url=%20JOIN%20THIS%20AMAZING%20GROUP%20%F0%9F%A5%B5%20-%20https%3A%2F%2Ft.me%2F%2Bcs76HfenGYI4MWQ1";

    // Final Link to redirect after completing 5 tasks
    const FINAL_DESTINATION_URL = "https://t.me/+cs76HfenGYI4MWQ1";

    // Global AdController instance
    let AdController = null;

    function initAdsgramController() {
      if (typeof window.Adsgram !== "undefined" && !AdController) {
        try {
          AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
        } catch (e) {
          console.error("Adsgram Init Error:", e);
        }
      }
    }

    // Initialize once on DOM content load
    window.addEventListener("DOMContentLoaded", () => {
      initAdsgramController();
    });

    // 1. Share Option Action
    function handleShareTask() {
      if (completedTasks >= totalTasks) {
        showShareModal();
        return;
      }

      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(DIRECT_SHARE_URL);
      } else {
        window.open(DIRECT_SHARE_URL, '_blank');
      }

      completedTasks++;
      updateUI();

      if (completedTasks >= totalTasks) {
        showShareModal();
      }
    }

    // Show Popup function
    function showShareModal() {
      document.getElementById('modal-share-count').innerText = "0";
      document.getElementById('shareModal').style.display = 'flex';
    }

    // Handle OK button inside modal popup
    function handleModalOkClick() {
      document.getElementById('shareModal').style.display = 'none';
      
      // Redirect to final destination URL after OK is clicked
      if (tg && tg.openTelegramLink && FINAL_DESTINATION_URL.includes("t.me")) {
        tg.openTelegramLink(FINAL_DESTINATION_URL);
      } else {
        window.location.href = FINAL_DESTINATION_URL;
      }
    }

    // 2. Unlock Click Action
    function handleUnlockClick() {
      if (completedTasks >= totalTasks) {
        showShareModal();
        return;
      }

      if (isAdLoading) return;

      const unlockBtn = document.getElementById('unlock-btn');

      if (!AdController) {
        initAdsgramController();
      }

      if (AdController) {
        isAdLoading = true;
        unlockBtn.disabled = true;
        unlockBtn.innerText = "🎥 Loading HD Video Player...";

        AdController.show()
          .then((result) => {
            completedTasks++;
            updateUI();

            if (completedTasks >= totalTasks) {
              showShareModal();
            } else {
              // Smooth 3 Second Buffer Delay
              startAdCooldown();
            }
          })
          .catch((error) => {
            console.error("Adsgram Error:", error);
            alert("Video buffer busy. Please click UNLOCK again!");
            resetBtnState();
          });
      } else {
        alert("Server connecting... Please try again in 2 seconds.");
      }
    }

    function startAdCooldown() {
      const unlockBtn = document.getElementById('unlock-btn');
      let countdown = 3;
      
      unlockBtn.innerText = `⚡ Fetching High-Speed Server in ${countdown}s...`;
      
      const timer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          unlockBtn.innerText = `⚡ Fetching High-Speed Server in ${countdown}s...`;
        } else {
          clearInterval(timer);
          resetBtnState();
        }
      }, 1000);
    }

    function resetBtnState() {
      isAdLoading = false;
      const unlockBtn = document.getElementById('unlock-btn');
      unlockBtn.disabled = false;
      updateUI();
    }

    // Update UI Progress
    function updateUI() {
      if (completedTasks > totalTasks) completedTasks = totalTasks;

      const percent = Math.round((completedTasks / totalTasks) * 100);
      document.getElementById('progress-percent').innerText = `${percent}% Completed`;
      document.getElementById('task-count').innerText = `${completedTasks} / ${totalTasks} Tasks`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      const unlockBtn = document.getElementById('unlock-btn');

      if (!isAdLoading) {
        if (completedTasks >= totalTasks) {
          unlockBtn.classList.add('active');
          unlockBtn.innerText = `🎉 UNLOCK VIDEOS NOW`;
        } else {
          unlockBtn.innerText = `UNLOCK VIDEOS (${completedTasks}/${totalTasks})`;
        }
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Video Unlocker</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script id="adsgram-script" src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #05070c;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background: #0d111a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      text-align: center;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.8px;
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1d4ed8, #3b82f6);
      border-radius: 20px;
      transition: width 0.4s ease-in-out;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-share {
      background: #1d75f2;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(29, 117, 242, 0.35);
    }

    .btn-unlock {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-unlock.active {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-title">SLEEPY SISTER IS LOCKED</div>

    <div class="progress-bar-bg">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>

    <div class="progress-meta">
      <span id="percent-text">0% Completed</span>
      <span id="tasks-text">0 / 6 Tasks</span>
    </div>

    <div class="btn-group">
      <button class="btn btn-share" onclick="handleShare()">SHARE</button>
      <button id="unlock-btn" class="btn btn-unlock" onclick="handleTaskClick()">UNLOCK VIDEOS (0/6)</button>
    </div>
  </div>

  <script>
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let completedTasks = 0;
    const totalTasks = 6;
    const ADSGRAM_BLOCK_ID = "43327";
    let isWaiting = false;

    const SHARE_LINK = "https://t.me/share/url?url=https%3A%2F%2Ft.me%2F%2Bcs76HfenGYI4MWQ1&text=Watch%20HD%20Videos";
    const FINAL_DESTINATION_URL = "https://t.me/+cs76HfenGYI4MWQ1";

    function handleTaskClick() {
      if (completedTasks >= totalTasks) {
        openFinalLink();
        return;
      }

      if (isWaiting) return;
      isWaiting = true;

      const unlockBtn = document.getElementById('unlock-btn');
      unlockBtn.disabled = true;
      unlockBtn.innerText = "CONNECTING AD...";

      executeAdCall();
    }

    function executeAdCall() {
      if (typeof window.Adsgram !== "undefined") {
        try {
          const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });

          const adTimeout = setTimeout(() => {
            isWaiting = false;
            startCoolDownBuffer("⏳ Verifying...", 8);
          }, 7000);

          AdController.show()
            .then((result) => {
              clearTimeout(adTimeout);
              if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
              }
              completedTasks++;
              updateUI();

              if (completedTasks >= totalTasks) {
                isWaiting = false;
              } else {
                startCoolDownBuffer("⏳ Next Task in", 8);
              }
            })
            .catch((error) => {
              clearTimeout(adTimeout);
              startCoolDownBuffer("⏳ System Busy, retry in", 8);
            });
        } catch (err) {
          startCoolDownBuffer("⏳ Retry in", 6);
        }
      } else {
        startCoolDownBuffer("⏳ Loading SDK, retry in", 6);
      }
    }

    function startCoolDownBuffer(msgPrefix, seconds) {
      const unlockBtn = document.getElementById('unlock-btn');
      let timeLeft = seconds;
      unlockBtn.disabled = true;

      const cooldown = setInterval(() => {
        unlockBtn.innerText = `${msgPrefix} ${timeLeft}s...`;
        timeLeft--;

        if (timeLeft < 0) {
          clearInterval(cooldown);
          isWaiting = false;
          unlockBtn.disabled = false;
          updateUI();
        }
      }, 1000);
    }

    function updateUI() {
      if (completedTasks > totalTasks) completedTasks = totalTasks;

      const percent = Math.round((completedTasks / totalTasks) * 100);
      document.getElementById('percent-text').innerText = `${percent}% Completed`;
      document.getElementById('tasks-text').innerText = `${completedTasks} / ${totalTasks} Tasks`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      const unlockBtn = document.getElementById('unlock-btn');

      if (!isWaiting) {
        unlockBtn.disabled = false;
        if (completedTasks >= totalTasks) {
          unlockBtn.classList.add('active');
          unlockBtn.innerText = "▶ WATCH FULL VIDEO NOW";
        } else {
          unlockBtn.innerText = `UNLOCK VIDEOS (${completedTasks}/${totalTasks})`;
        }
      }
    }

    function handleShare() {
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(SHARE_LINK);
      } else {
        window.open(SHARE_LINK, '_blank');
      }
    }

    function openFinalLink() {
      if (tg && tg.openTelegramLink && FINAL_DESTINATION_URL.includes("t.me")) {
        tg.openTelegramLink(FINAL_DESTINATION_URL);
      } else {
        window.location.href = FINAL_DESTINATION_URL;
      }
    }
  </script>

</body>
</html>

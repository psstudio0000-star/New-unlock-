<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Content Unlocker</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #161b26;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      border: 1px solid #232a3b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .progress-bar-container {
      width: 100%;
      height: 24px;
      background-color: #212938;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: #007aff;
      border-radius: 12px;
      transition: width 0.3s ease;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      font-weight: 500;
      color: #8e9bae;
      margin-bottom: 28px;
      padding: 0 4px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s ease, background-color 0.2s ease;
    }

    .btn:active {
      opacity: 0.8;
    }

    /* Primary Action: Share Button */
    .btn-share {
      background-color: #007aff;
      color: #ffffff;
    }

    /* Target Action: Unlock Button */
    .btn-unlock {
      background-color: #212938;
      color: #8e9bae;
      cursor: not-allowed;
      margin-bottom: 0;
    }

    .btn-unlock.active {
      background-color: #eab308;
      color: #000000;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>STEP MOM IS LOCKED</h2>

    <div class="progress-bar-container">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>

    <div class="progress-info">
      <span id="progress-percent">0% Completed</span>
      <span id="task-count">0 / 5 Tasks</span>
    </div>

    <!-- Option 1: Share Link -->
    <button class="btn btn-share" onclick="handleShareTask()">SHARE</button>

    <!-- Option 2: Final Unlock Action (Increments or Redirects when done) -->
    <button id="unlock-btn" class="btn btn-unlock" disabled onclick="unlockContent()">UNLOCK VIDEOS (0/5)</button>
  </div>

  <script>
    // Initialize Telegram WebApp SDK
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Configuration
    let completedTasks = 0;
    const totalTasks = 5;
    
    // Telegram Share URL for task completion
    const DIRECT_SHARE_URL = "https://t.me/share/url?url=%20JOIN%20THIS%20AMAZING%20GROUP%20%F0%9F%A5%B5%20-%20https%3A%2F%2Ft.me%2F%2BIReYrDe7TbowZGNl";

    // Final Link to redirect after completing 5 tasks
    const FINAL_DESTINATION_URL = "https://t.me/+IReYrDe7TbowZGNl";

    // 1. Share Option Action
    function handleShareTask() {
      if (completedTasks >= totalTasks) return;

      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(DIRECT_SHARE_URL);
      } else {
        window.open(DIRECT_SHARE_URL, '_blank');
      }

      completedTasks++;
      updateUI();
    }

    // 2. Final Unlock Action - Redirects once all tasks are completed
    function unlockContent() {
      if (completedTasks >= totalTasks) {
        if (tg && tg.openTelegramLink && FINAL_DESTINATION_URL.includes("t.me")) {
          tg.openTelegramLink(FINAL_DESTINATION_URL);
        } else {
          window.location.href = FINAL_DESTINATION_URL;
        }
      }
    }

    // Update UI Progress
    function updateUI() {
      if (completedTasks > totalTasks) completedTasks = totalTasks;

      const percent = Math.round((completedTasks / totalTasks) * 100);
      document.getElementById('progress-percent').innerText = `${percent}% Completed`;
      document.getElementById('task-count').innerText = `${completedTasks} / ${totalTasks} Tasks`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      const unlockBtn = document.getElementById('unlock-btn');

      if (completedTasks >= totalTasks) {
        unlockBtn.classList.add('active');
        unlockBtn.disabled = false;
        unlockBtn.innerText = `🎉 UNLOCK VIDEOS NOW`;
      } else {
        unlockBtn.innerText = `UNLOCK VIDEOS (${completedTasks}/${totalTasks})`;
      }
    }
  </script>

</body>
</html>

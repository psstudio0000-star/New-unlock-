<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Group Unlock Portal</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0088cc;
      --accent-hover: #0077b5;
      --success-color: #22c55e;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .icon-header {
      font-size: 54px;
      margin-bottom: 12px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    /* Progress Box */
    .progress-box {
      background: rgba(15, 23, 42, 0.6);
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #334155;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0088cc, #22c55e);
      border-radius: 6px;
      transition: width 0.4s ease-in-out;
    }

    /* Buttons */
    .action-btn {
      width: 100%;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .btn-share {
      background: #0088cc;
      color: #ffffff;
    }

    .btn-share:active {
      background: #0077b5;
      transform: scale(0.98);
    }

    .btn-ad {
      background: #f59e0b;
      color: #ffffff;
    }

    .btn-ad:active {
      background: #d97706;
      transform: scale(0.98);
    }

    .btn-unlock {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      margin-top: 12px;
      margin-bottom: 0;
      font-size: 16px;
    }

    .btn-unlock.active {
      background: #22c55e;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon-header">🔐</div>
    <h1 id="group-title">GROUP IS LOCKED</h1>
    <p class="subtitle">Complete 5 tasks below to unlock instant access</p>

    <!-- Progress Status -->
    <div class="progress-box">
      <div class="progress-header">
        <span id="task-count">0 / 5 Tasks</span>
        <span id="progress-percent">0% Completed</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <!-- Task Buttons -->
    <button class="action-btn btn-share" onclick="handleShareTask()">
      <span>📤</span> Share to Telegram Group (+1 Task)
    </button>

    <button class="action-btn btn-ad" onclick="playAd()">
      <span>🎬</span> Watch Short Video Ad (+1 Task)
    </button>

    <div class="divider"></div>

    <!-- Unlock Button -->
    <button id="unlock-btn" class="action-btn btn-unlock" onclick="unlockContent()" disabled>
      🔒 UNLOCK GROUP (0/5)
    </button>
  </div>

  <script>
    // Configuration
    let completedTasks = 0;
    const totalTasks = 5;
    const ADSGRAM_BLOCK_ID = "40172";
    
    // Target private channel/group link unlocked after tasks completion
    const TARGET_GROUP_LINK = "https://t.me/+cs76HfenGYI4MWQ1";
    
    // Direct share URL for task
    const DIRECT_SHARE_URL = "https://t.me/share/url?url=%20JOIN%20THIS%20AMAZING%20GROUP%20%F0%9F%A5%B5%20-%20https%3A%2F%2Ft.me%2F%2Bcs76HfenGYI4MWQ1";

    // Telegram WebApp Object Initialization
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Dynamic Title Setup based on URL parameter (e.g. ?group=mom_son)
    const urlParams = new URLSearchParams(window.location.search);
    const groupParam = urlParams.get('group');
    if (groupParam === 'mom_son') {
      document.getElementById('group-title').innerText = "MOM SON SPECIAL 🔞";
    }

    // 1. Share Option Action
    function handleShareTask() {
      if (completedTasks >= totalTasks) return;

      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(DIRECT_SHARE_URL);
      } else {
        window.open(DIRECT_SHARE_URL, '_blank');
      }

      completedTasks++;
      updateUI();
    }

    // 2. Watch Ad Option Action
    function playAd() {
      if (completedTasks >= totalTasks) return;

      if (typeof window.Adsgram !== "undefined") {
        try {
          const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });

          AdController.show()
            .then((result) => {
              completedTasks++;
              updateUI();
            })
            .catch((error) => {
              console.error("Adsgram Error:", error);
              alert("Ad closed early or temporarily unavailable. Please try again!");
            });
        } catch (err) {
          console.error(err);
        }
      } else {
        alert("Adsgram SDK is loading or blocked by AdBlocker.");
      }
    }

    // 3. Final Unlock Action (Opens target link after completing 5 tasks)
    function unlockContent() {
      if (completedTasks >= totalTasks) {
        if (tg && tg.openTelegramLink) {
          tg.openTelegramLink(TARGET_GROUP_LINK);
        } else {
          window.open(TARGET_GROUP_LINK, '_blank');
        }
      } else {
        alert(`Please complete all 5 tasks first! (${completedTasks}/5 completed)`);
      }
    }

    // Update UI Elements and Progress Bar
    function updateUI() {
      if (completedTasks > totalTasks) completedTasks = totalTasks;

      const percent = Math.round((completedTasks / totalTasks) * 100);
      document.getElementById('progress-percent').innerText = `${percent}% Completed`;
      document.getElementById('task-count').innerText = `${completedTasks} / ${totalTasks} Tasks`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      const unlockBtn = document.getElementById('unlock-btn');

      if (completedTasks >= totalTasks) {
        unlockBtn.classList.add('active');
        unlockBtn.disabled = false;
        unlockBtn.innerText = `🎉 JOIN UNLOCKED GROUP NOW`;
      } else {
        unlockBtn.innerText = `🔒 UNLOCK GROUP (${completedTasks}/${totalTasks})`;
      }
    }
  </script>
</body>
</html>

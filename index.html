<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unlock Video & Share System</title>
  
  <!-- Telegram Web App Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Adsgram SDK Script -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Video Player Container */
    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .video-box {
      width: 100%;
      height: 220px;
      background-color: #1a1a1a;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid #333;
    }

    .action-btn {
      background-color: #0088cc;
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    /* Modal Popup Overlay */
    .modal-overlay {
      display: none; /* Initially hidden */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* Popup Box according to image */
    .modal-box {
      background-color: #080808;
      border: 1.5px solid #ff3b30;
      border-radius: 18px;
      padding: 28px 20px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 59, 48, 0.25);
    }

    .share-count-text {
      color: #ff3b30;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .share-instruction {
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .ok-btn {
      background-color: #ff3b30;
      color: #ffffff;
      border: none;
      padding: 12px 0;
      width: 100%;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .ok-btn:active {
      opacity: 0.85;
    }

    /* Unlocked Content Area */
    #unlockedContent {
      display: none;
      margin-top: 15px;
      color: #4cd964;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="video-box" id="videoPlaceholder">
      <p style="color: #888;">Video Locked 🔒</p>
    </div>

    <button class="action-btn" id="watchAdBtn" onclick="playVideoAd()">Watch Ad to Unlock</button>
    <div id="unlockedContent">🎉 Content Successfully Unlocked!</div>
  </div>

  <!-- Modal Popup (Exact Image Replica) -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal-box">
      <div class="share-count-text">YOUR SHARE = <span id="shareCount">0</span></div>
      <div class="share-instruction" id="popupMsg">SHARE TO 3 USERS TO UNLOCK</div>
      <button class="ok-btn" onclick="handleShareClick()">OK</button>
    </div>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.ready();

    // Configuration
    const REQUIRED_SHARES = 3;
    let currentShares = parseInt(localStorage.getItem('userShares') || '0');

    // Adsgram Controller Initialization (Apna Block ID Yahan Lagayein)
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_ADSGRAM_BLOCK_ID" }) : null;

    function playVideoAd() {
      if (AdController) {
        // Adsgram Video Ad Play Call
        AdController.show().then((result) => {
          // Ad Successfully Completed
          onAdCompleted();
        }).catch((result) => {
          // If Ad fails or user closes early
          alert("Please watch the full ad to proceed.");
        });
      } else {
        // Fallback for testing / Demo
        console.log("Ad completed (Demo Mode)");
        onAdCompleted();
      }
    }

    function onAdCompleted() {
      // Refresh share display counter
      document.getElementById('shareCount').innerText = currentShares;
      
      if (currentShares >= REQUIRED_SHARES) {
        unlockMainContent();
      } else {
        // Show the Share requirement popup
        document.getElementById('shareModal').style.display = 'flex';
      }
    }

    function handleShareClick() {
      // Increment share count logic
      currentShares++;
      localStorage.setItem('userShares', currentShares);
      document.getElementById('shareCount').innerText = currentShares;

      // Telegram Native Share Trigger
      const shareUrl = "https://t.me/share/url?url=" + encodeURIComponent(window.location.href) + "&text=" + encodeURIComponent("Watch premium videos for free!");
      
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }

      // Check if requirement reached after click
      if (currentShares >= REQUIRED_SHARES) {
        document.getElementById('shareModal').style.display = 'none';
        unlockMainContent();
      }
    }

    function unlockMainContent() {
      document.getElementById('shareModal').style.display = 'none';
      document.getElementById('watchAdBtn').style.display = 'none';
      document.getElementById('videoPlaceholder').innerHTML = '<p style="color: #4cd964;">▶️ Video Playing Now</p>';
      document.getElementById('unlockedContent').style.display = 'block';
    }
  </script>

</body>
</html>

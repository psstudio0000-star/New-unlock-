<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HD Premium Video Player</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script id="adsgram-script" src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #090d16 60%, #030712 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    .card {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
    }

    .player-preview {
      width: 100%;
      height: 195px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.1) 0%, rgba(15, 23, 42, 0.95) 100%), 
                  url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=600&auto=format&fit=crop') center/cover;
      border-radius: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .play-icon {
      width: 62px;
      height: 62px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.85);
      cursor: pointer;
    }

    .play-icon::after {
      content: '';
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 11px 0 11px 19px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 5px;
    }

    .steps-grid {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 18px;
    }

    .step-box {
      flex: 1;
      height: 36px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
    }

    .step-box.completed {
      background: rgba(34, 197, 94, 0.18);
      border-color: #22c55e;
      color: #4ade80;
    }

    .progress-bar-container {
      width: 100%;
      height: 12px;
      background-color: rgba(15, 23, 42, 0.9);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #06b6d4, #10b981);
      border-radius: 20px;
      transition: width 0.5s ease;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-weight: 800;
      font-size: 0.95rem;
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      color: #ffffff;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.8;
      cursor: not-allowed;
    }

    .modal-overlay {
      display: flex;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(3, 7, 18, 0.92);
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid #ef4444;
      border-radius: 26px;
      padding: 28px 22px;
      width: 88%;
      max-width: 340px;
      text-align: center;
    }

    .share-link-btn {
      display: block;
      width: 100%;
      text-decoration: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      padding: 15px 0;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .ok-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      border: none;
      padding: 15px 0;
      width: 100%;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .inline-error {
      color: #f87171;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="player-preview">
      <div class="play-icon" onclick="handleUnlockClick()"></div>
    </div>

    <h3 style="margin-bottom: 12px;">STEP MOM (FULL MOVIE)</h3>

    <div class="steps-grid">
      <div class="step-box" id="step-1">KEY 1</div>
      <div class="step-box" id="step-2">KEY 2</div>
      <div class="step-box" id="step-3">KEY 3</div>
      <div class="step-box" id="step-4">KEY 4</div>
      <div class="step-box" id="step-5">KEY 5</div>
    </div>

    <div class="progress-bar-container">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>

    <div class="progress-info">
      <span id="progress-percent">0% Decrypted</span>
      <span id="task-count">0 / 5 Keys</span>
    </div>

    <button id="unlock-btn" class="btn" onclick="handleUnlockClick()">🔓 UNLOCK KEY 1 (0/5)</button>
  </div>

  <div class="modal-overlay" id="shareModal">
    <div class="modal-box">
      <h3 style="color: #ef4444; margin-bottom: 8px;">SHARE REQUIRED 🔗</h3>
      <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 16px;">Pehle niche diye gaye SHARE button par click karke groups me send karein!</p>
      
      <div id="modal-error-msg" class="inline-error">❌ Pehle SHARE button par click karein!</div>

      <a class="share-link-btn" href="https://t.me/share/url?url=https%3A%2F%2Ft.me%2F%2Bcs76HfenGYI4MWQ1&text=JOIN%20THIS%20AMAZING%20GROUP" target="_blank" onclick="registerShareClick()">
        📲 SHARE TO GROUPS
      </a>

      <button id="modal-ok-btn" class="ok-btn" onclick="handleModalOkClick()">▶ WATCH NOW FULL HD</button>
    </div>
  </div>

  <script>
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let completedTasks = 0;
    const totalTasks = 5;
    const ADSGRAM_BLOCK_ID = "43334";
    let isWaiting = false;
    let hasShared = false;

    const FINAL_DESTINATION_URL = "https://t.me/+cs76HfenGYI4MWQ1";

    const stepMessages = [
      "🔓 UNLOCK KEY 1 (0/5)",
      "⚡ UNLOCK KEY 2 (1/5)",
      "🎥 UNLOCK KEY 3 (2/5)",
      "🔑 UNLOCK KEY 4 (3/5)",
      "🚀 FINAL UNLOCK KEY (4/5)"
    ];

    function handleUnlockClick() {
      if (completedTasks >= totalTasks) {
        showShareModal();
        return;
      }

      if (isWaiting) return;
      isWaiting = true;

      const unlockBtn = document.getElementById('unlock-btn');
      unlockBtn.disabled = true;
      unlockBtn.innerText = "📺 WATCH FULL AD TO UNLOCK...";

      executeAdCall();
    }

    function executeAdCall() {
      if (typeof window.Adsgram !== "undefined") {
        try {
          const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });

          AdController.show().then((result) => {
            if (result && (result.done || result.rewarded || result.state === 'completed')) {
              if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
              }
              completedTasks++;
              updateUI();

              if (completedTasks >= totalTasks) {
                isWaiting = false;
                showShareModal();
              } else {
                startCoolDownBuffer("⏳ Next Key Available in", 10);
              }
            } else {
              startCoolDownBuffer("⚠️ Ad Skipped! Complete Ad in", 5);
            }
          }).catch(() => {
            startCoolDownBuffer("⚠️ Ad Not Finished! Retry in", 5);
          });
        } catch (err) {
          startCoolDownBuffer("⏳ Loading Ad, retry in", 6);
        }
      } else {
        startCoolDownBuffer("⏳ Reloading SDK, retry in", 6);
      }
    }

    function startCoolDownBuffer(msgPrefix, seconds) {
      const unlockBtn = document.getElementById('unlock-btn');
      let timeLeft = seconds;
      unlockBtn.disabled = true;

      const cooldown = setInterval(() => {
        unlockBtn.innerText = `${msgPrefix} ${timeLeft}s...`;
        timeLeft--;

        if (timeLeft < 0) {
          clearInterval(cooldown);
          isWaiting = false;
          unlockBtn.disabled = false;
          updateUI();
        }
      }, 1000);
    }

    function updateUI() {
      if (completedTasks > totalTasks) completedTasks = totalTasks;

      for (let i = 1; i <= totalTasks; i++) {
        const box = document.getElementById(`step-${i}`);
        if (i <= completedTasks) {
          box.classList.add('completed');
          box.innerText = "✓ OK";
        }
      }

      const percent = Math.round((completedTasks / totalTasks) * 100);
      document.getElementById('progress-percent').innerText = `${percent}% Decrypted`;
      document.getElementById('task-count').innerText = `${completedTasks} / ${totalTasks} Keys`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      const unlockBtn = document.getElementById('unlock-btn');

      if (!isWaiting) {
        unlockBtn.disabled = false;
        if (completedTasks >= totalTasks) {
          unlockBtn.innerText = `⚠️ SHARE REQUIRED TO STREAM`;
        } else {
          unlockBtn.innerText = stepMessages[completedTasks];
        }
      }
    }

    function showShareModal() {
      document.getElementById('shareModal').classList.add('show');
    }

    function registerShareClick() {
      hasShared = true;
      document.getElementById('modal-error-msg').style.display = 'none';
      document.getElementById('modal-ok-btn').innerText = "✅ UNLOCKED! WATCH NOW";
    }

    function handleModalOkClick() {
      if (!hasShared) {
        document.getElementById('modal-error-msg').style.display = 'block';
        return;
      }

      document.getElementById('shareModal').classList.remove('show');
      if (tg && tg.openTelegramLink && FINAL_DESTINATION_URL.includes("t.me")) {
        tg.openTelegramLink(FINAL_DESTINATION_URL);
      } else {
        window.location.href = FINAL_DESTINATION_URL;
      }
    }
  </script>
</body>
</html>
